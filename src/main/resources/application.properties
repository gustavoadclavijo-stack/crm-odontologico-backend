spring.application.name=kassar
server.port=8080

# ==========================================================
# Configuración del proveedor de IA y autocorrección
# ==========================================================
odontograma.ai.max-attempts=3

odontograma.ai.provider=${ODONTOGRAMA_AI_PROVIDER:google-genai}
spring.ai.model.chat=${odontograma.ai.provider}
spring.ai.model.image=none

# Google AI Studio. La clave se obtiene únicamente del entorno.
spring.ai.google.genai.api-key=${GOOGLE_AI_STUDIO_API_KEY}
spring.ai.google.genai.chat.model=${GOOGLE_AI_STUDIO_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.response-mime-type=application/json
spring.ai.google.genai.chat.temperature=0.1

# Configuración conservada para el proveedor Ollama.
odontograma.ai.ollama.base-url=http://localhost:11434
odontograma.ai.ollama.chat-endpoint=/api/chat
odontograma.ai.ollama.model=odontograma-llama:latest
odontograma.ai.ollama.temperature=0.1
odontograma.ai.ollama.connect-timeout-seconds=10
odontograma.ai.ollama.read-timeout-seconds=180
